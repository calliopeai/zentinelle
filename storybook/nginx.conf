# Replaces the image's nginx.conf. nginx runs as uid 101, not root, so the
# pid file and temp paths live in /tmp and it listens on 8080.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    # Serve the .gz files the image build wrote; compress on the fly only what has none.
    gzip_static on;
    gzip_vary on;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        # Behind the ingress: a directory redirect must not name this port.
        absolute_redirect off;
        # Every deploy replaces the catalog (index.json, index.html, iframe.html,
        # project.json); revalidate by ETag instead of serving a stale one.
        add_header Cache-Control "no-cache" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Vite-hashed bundles never change under the same name.
        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Storybook's own files keep their names across builds: a day, then revalidate by ETag.
        location ~ ^/sb-(manager|addons|common-assets|preview)/ {
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
