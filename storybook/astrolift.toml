astrolift_version = 1
name = "storybook-zentinelle"

[app]
slug = "storybook-zentinelle"
display_name = "Zentinelle AI Storybook"

[environments.production]

[[workloads]]
name = "web"
kind = "deployment"
is_public = true
replicas = 1
cpu_request = "25m"
cpu_limit = "500m"
memory_request = "16Mi"
memory_limit = "48Mi"

[[workloads.containers]]
name = "web"
is_primary = true
# Container paths resolve from this file's directory. The context is the
# repository root (".."); the Dockerfile is named through it, because a
# bare "Dockerfile" would mean the root's own.
build_context = ".."
dockerfile_path = "../storybook/Dockerfile"
port = 8080

[workloads.containers.healthcheck]
kind = "http"
value = "/healthz"
port = 8080

[ingress]
class = "alb"

[ingress.auth]
kind = "oidc"
auth_proxy_host = "auth.astro.conflict.cloud"
discovery_url = "https://cognito-idp.us-west-2.amazonaws.com/us-west-2_xU96Y7DAg/.well-known/openid-configuration"
client_id = "1unkru25uqbon23mnhj2cpv3hd"
