# The Zentinelle AI console Storybook, a private app on the CONFLICT Astrolift
# install behind central sign-in. ci_pushed: the managed workflow builds
# storybook/Dockerfile from the repository root (the image needs frontend/),
# so the app is registered with those paths, not this directory:
#
#   astro app register -f storybook/astrolift.toml \
#     --manifest-path storybook/astrolift.toml --source-repo calliopeai/zentinelle \
#     --project-id <guid> --build-mode ci_pushed \
#     --build-context . --dockerfile storybook/Dockerfile --yes

astrolift_version = 1
name = "storybook-zentinelle"

[app]
slug = "storybook-zentinelle"
display_name = "Zentinelle AI Storybook"

[environments.production]

[[workloads]]
name = "web"
kind = "deployment"
is_public = true
replicas = 1
cpu_request = "25m"
cpu_limit = "100m"
memory_request = "16Mi"
memory_limit = "48Mi"

[[workloads.containers]]
name = "web"
is_primary = true
port = 8080

[workloads.containers.healthcheck]
kind = "http"
value = "/healthz"
port = 8080

[ingress]
class = "alb"

[ingress.auth]
kind = "oidc"
auth_proxy_host = "auth.astro.conflict.cloud"
discovery_url = "https://cognito-idp.us-west-2.amazonaws.com/us-west-2_xU96Y7DAg/.well-known/openid-configuration"
client_id = "1unkru25uqbon23mnhj2cpv3hd"
