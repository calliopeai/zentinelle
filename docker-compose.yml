services:
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      - DEBUG=${DEBUG:-false}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-zentinelle}
      - POSTGRES_USER=${POSTGRES_USER:-zentinelle}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-zentinelle}
      - REDIS_URL=redis://redis:6379/0
      - TEMPORAL_ADDRESS=temporal:7233
      - ZENTINELLE_BOOTSTRAP_SECRET=${ZENTINELLE_BOOTSTRAP_SECRET:-dev-bootstrap-secret}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    volumes:
      - ./backend:/app
      # The backend registers the local gateway (this install's one tenant)
      # and writes its credential here; the gateway reads it (#380).
      - gateway_credential:/var/run/zentinelle
    command: >
      sh -c "
        python manage.py prepare_schemas &&
        python manage.py migrate --database default --no-input &&
        python manage.py migrate --database zentinelle --no-input &&
        python manage.py migrate --database analytics --no-input &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload --timeout 60
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/zentinelle/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # One worker replaces the Celery worker and Celery beat: it runs every
  # background task and upserts the Temporal Schedules at start.
  temporal-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-zentinelle}
      - POSTGRES_USER=${POSTGRES_USER:-zentinelle}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-zentinelle}
      - REDIS_URL=redis://redis:6379/0
      - TEMPORAL_ADDRESS=temporal:7233
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    volumes:
      - ./backend:/app
    # The server takes a few seconds to accept connections after it starts.
    restart: on-failure
    command: python manage.py temporal_worker

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      - ZENTINELLE_URL=http://backend:8000
      - GATEWAY_PORT=8742
      - FAIL_OPEN=false
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - gateway_credential:/var/run/zentinelle:ro
    ports:
      - "${GATEWAY_PORT_HOST:-8742}:8742"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      - NEXT_PUBLIC_GQL_URL=/gql/zentinelle/
      - NEXT_PUBLIC_API_URL=/api/zentinelle/v1
      - NEXT_PUBLIC_AUTH_MODE=${AUTH_MODE:-local}
      - INTERNAL_API_URL=http://backend:8000/api/zentinelle/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- --port 3000

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zentinelle}
      POSTGRES_USER: ${POSTGRES_USER:-zentinelle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zentinelle}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT_HOST:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zentinelle}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT_HOST:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Temporal server, persisted in the postgres service (databases temporal and
  # temporal_visibility), with the zentinelle namespace created on first start.
  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-zentinelle}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-zentinelle}
      - POSTGRES_SEEDS=postgres
      - DEFAULT_NAMESPACE=zentinelle
      - DEFAULT_NAMESPACE_RETENTION=24h
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TEMPORAL_PORT_HOST:-57233}:7233"

  temporal-ui:
    image: temporalio/ui:2.55.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT_HOST:-58233}:8080"

  # ClickHouse — optional, for high-volume analytics
  # Enable with: docker compose --profile analytics up
  clickhouse:
    profiles: ["analytics"]
    image: clickhouse/clickhouse-server:24-alpine
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./backend/zentinelle/clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  gateway_credential:
