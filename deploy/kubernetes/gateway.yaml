# The Zentinelle gateway as a cluster-local enforcement point.
#
# Deployed into each Astrolift-managed cluster. Paired with the egress policy
# in network-policy-cilium.yaml, it is what turns governance from something
# agents opt into by pointing at a proxy, into something they cannot avoid:
# the network refuses to carry a request to a provider that did not come
# through here.
#
# Apply into the namespace the agents run in, or a neighbouring one the policy
# allows them to reach.
---
apiVersion: v1
kind: Namespace
metadata:
  name: zentinelle
  labels:
    app.kubernetes.io/part-of: zentinelle
---
apiVersion: v1
kind: Secret
metadata:
  name: zentinelle-gateway-providers
  namespace: zentinelle
type: Opaque
stringData:
  # Read with each agent's key to get the provider key that agent's tenant
  # stored in Zentinelle, so agents and this Secret hold no provider keys. The
  # same value is ZENTINELLE_GATEWAY_TOKEN on the Zentinelle backend. At least
  # 32 characters: openssl rand -hex 32. It reads the stored key of any tenant
  # whose agent key it is presented with, so only gateways the Zentinelle
  # operator runs get it.
  ZENTINELLE_GATEWAY_TOKEN: "replace-me"

  # Single-tenant fallback, used only with ALLOW_ENV_PROVIDER_KEYS "true" and
  # only for a tenant with no stored key. One entry per provider; the name
  # after the prefix, lowercased, is the provider name in the gateway's routing
  # table.
  # PROVIDER_KEY_OPENAI: "replace-me"
  # PROVIDER_KEY_ANTHROPIC: "replace-me"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zentinelle-gateway
  namespace: zentinelle
data:
  # The Zentinelle service, which is usually outside this cluster.
  ZENTINELLE_URL: "https://zentinelle.example.com"

  # Who this cluster is. One Zentinelle serves many clusters, and without
  # these its events, evaluations and interaction logs cannot be told apart.
  ZENTINELLE_TENANT_ID: "acme-corp"
  ZENTINELLE_CLUSTER_ID: "prod-us-east-1"

  # "true" lets the PROVIDER_KEY_* entries in the Secret serve a tenant with no
  # stored key. Single-tenant clusters only: every such tenant would be served
  # on those accounts.
  ALLOW_ENV_PROVIDER_KEYS: "false"

  # false means a request is refused when Zentinelle cannot be reached. For a
  # cluster whose whole point is that agents cannot route around governance,
  # fail-open is the setting that quietly undoes it — but it is also the
  # setting that keeps agents working during an outage, so it is a choice to
  # make per cluster rather than a default to inherit.
  FAIL_OPEN: "false"

  # Prompt and completion text leaves the cluster with this on. Turn it off
  # where that is not acceptable; the policy decisions still happen either way.
  LOG_INTERACTIONS: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zentinelle-gateway
  namespace: zentinelle
  labels:
    app.kubernetes.io/name: zentinelle-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: zentinelle-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zentinelle-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8742"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: gateway
          image: ghcr.io/calliopeai/zentinelle-gateway:latest
          ports:
            - name: http
              containerPort: 8742
          envFrom:
            - configMapRef:
                name: zentinelle-gateway
            - secretRef:
                name: zentinelle-gateway-providers
          # Both probes hit /health, which reads no state and takes no
          # parameter, so a slow policy check cannot make the pod look dead.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: zentinelle-gateway
  namespace: zentinelle
  labels:
    app.kubernetes.io/name: zentinelle-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zentinelle-gateway
  ports:
    - name: http
      port: 8742
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zentinelle-gateway
  namespace: zentinelle
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zentinelle-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
