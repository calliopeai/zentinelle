# The Zentinelle gateway as a cluster-local enforcement point.
#
# Deployed into each Astrolift-managed cluster. Paired with the egress policy
# in network-policy-cilium.yaml, it is what turns governance from something
# agents opt into by pointing at a proxy, into something they cannot avoid:
# the network refuses to carry a request to a provider that did not come
# through here.
#
# Apply into the namespace the agents run in, or a neighbouring one the policy
# allows them to reach.
#
# The gateway token is a Secret this file deliberately does not contain: its
# value must be random, generated once and never committed. Create it after
# applying this file (the pods wait for it), without replacing one that exists:
#
#   kubectl get secret zentinelle-gateway-token -n zentinelle >/dev/null 2>&1 ||
#     kubectl create secret generic zentinelle-gateway-token -n zentinelle \
#       --from-literal=token="$(openssl rand -hex 32)"
#
# The Deployment mounts it as /var/run/zentinelle/gateway-token. The Zentinelle
# backend needs the same value; README.md shows both ways to give it.
---
apiVersion: v1
kind: Namespace
metadata:
  name: zentinelle
  labels:
    app.kubernetes.io/part-of: zentinelle
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zentinelle-gateway
  namespace: zentinelle
data:
  # The Zentinelle service, which is usually outside this cluster.
  ZENTINELLE_URL: "https://zentinelle.example.com"

  # Who this cluster is. One Zentinelle serves many clusters, and without
  # these its events, evaluations and interaction logs cannot be told apart.
  ZENTINELLE_TENANT_ID: "acme-corp"
  ZENTINELLE_CLUSTER_ID: "prod-us-east-1"

  # Where the gateway token Secret is mounted, below. This is the default,
  # stated so the path is visible next to the mount.
  ZENTINELLE_GATEWAY_TOKEN_FILE: "/var/run/zentinelle/gateway-token"

  # false means a request is refused when Zentinelle cannot be reached. For a
  # cluster whose whole point is that agents cannot route around governance,
  # fail-open is the setting that quietly undoes it — but it is also the
  # setting that keeps agents working during an outage, so it is a choice to
  # make per cluster rather than a default to inherit.
  FAIL_OPEN: "false"

  # Prompt and completion text leaves the cluster with this on. Turn it off
  # where that is not acceptable; the policy decisions still happen either way.
  LOG_INTERACTIONS: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zentinelle-gateway
  namespace: zentinelle
  labels:
    app.kubernetes.io/name: zentinelle-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: zentinelle-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zentinelle-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8742"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      volumes:
        # The generated Secret described at the top of this file. Mounted as a
        # directory rather than with subPath, so a rotated value reaches the
        # running pod, which reads the file again when the backend refuses the
        # old token.
        - name: gateway-token
          secret:
            secretName: zentinelle-gateway-token
            defaultMode: 0440
            items:
              - key: token
                path: gateway-token
      containers:
        - name: gateway
          image: ghcr.io/calliopeai/zentinelle-gateway:latest
          ports:
            - name: http
              containerPort: 8742
          envFrom:
            - configMapRef:
                name: zentinelle-gateway
          volumeMounts:
            - name: gateway-token
              mountPath: /var/run/zentinelle
              readOnly: true
          # Both probes hit /health, which reads no state and takes no
          # parameter, so a slow policy check cannot make the pod look dead.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: zentinelle-gateway
  namespace: zentinelle
  labels:
    app.kubernetes.io/name: zentinelle-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zentinelle-gateway
  ports:
    - name: http
      port: 8742
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zentinelle-gateway
  namespace: zentinelle
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zentinelle-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
