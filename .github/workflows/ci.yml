name: CI

# Zentinelle had no pull-request CI at all: build-publish.yml and docs.yml both
# trigger only on push-to-main and tags, so a PR merged with zero checks and
# `gh pr checks` reported "no checks reported". Flagged on #270 as worth fixing
# before the stack carries production traffic.
#
# What runs here is what the pre-commit checklist in CLAUDE.md already asks a
# human to run, which is the point: the checklist stops depending on whoever is
# at the keyboard remembering it.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zentinelle
          POSTGRES_USER: zentinelle
          POSTGRES_PASSWORD: zentinelle
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # DATABASE_URL wins over the POSTGRES_* variables in settings, and the
      # repo's .env points at the compose service name, so it must be set
      # explicitly here or every test errors on "could not translate host name".
      DATABASE_URL: postgresql://zentinelle:zentinelle@localhost:5432/zentinelle
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings
      AUTH_MODE: local
      CLICKHOUSE_URL: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install pipenv
          pipenv install --dev --deploy --system || pipenv install --dev --system

      # Step 1 of the checklist. A schema ordering violation or a bad import is
      # a service that does not come up on deploy, so it is checked before
      # anything slower runs.
      - name: Django starts
        working-directory: backend
        run: python -c "import django, os; os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings'); django.setup()"

      # Step 2. A missing migration is data loss or a failed start in prod.
      - name: No missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        working-directory: backend
        run: python -m pytest -q


      - name: Backend lint
        working-directory: backend
        run: |
          flake8
          isort --check-only .

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Real gateway and multi-schema backend contract
        env:
          ZENTINELLE_CONTRACT_TEST: '1'
          CONTRACT_KEYS_FILE: /tmp/zentinelle-contract-keys.json
          CONTRACT_BACKEND_URL: http://127.0.0.1:62592
          CELERY_BROKER_URL: memory://
          CELERY_RESULT_BACKEND: cache+memory://
        run: |
          python backend/manage.py prepare_schemas
          python backend/manage.py migrate --database default --no-input
          python backend/manage.py migrate --database zentinelle --no-input
          python backend/manage.py migrate --database analytics --no-input
          python backend/manage.py shell < tests/integration/seed_gateway_contract.py
          python backend/manage.py runserver 127.0.0.1:62592 --noreload > /tmp/zentinelle-contract-server.log 2>&1 &
          contract_pid=$!
          trap 'kill "$contract_pid"; rm -f "$CONTRACT_KEYS_FILE"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:62592/api/zentinelle/v1/health > /dev/null; then break; fi
            sleep 1
          done
          go -C gateway test -race -run TestRealBackendEnforcementContract -v

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Vet
        working-directory: gateway
        run: go vet ./...

      - name: Test
        working-directory: gateway
        run: go test -race ./...

  sdk:
    name: SDK contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Java SDK tests
        working-directory: sdk/java
        run: mvn -B test

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: C# SDK tests
        working-directory: sdk/csharp
        run: dotnet test --configuration Release --no-restore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: frontend
        # Plain `npm ci`, matching frontend/Dockerfile. No
        # --legacy-peer-deps on either side any more: the flag was absorbing a
        # lockfile desync (#309), and absorbing it meant the next one would go
        # unnoticed too. Failing loudly is the point of committing a lockfile.
        run: npm ci

      # The build, not just tsc. Local `tsc` has passed while the Next build
      # failed more than once — they do not check the same things.
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
